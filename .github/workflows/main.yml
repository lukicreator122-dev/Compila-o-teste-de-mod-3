name: Compilar Mod Linhas e Fita

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extrair ZIP e preparar Forge 1.20.1
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -q -o *.zip
          fi
          BUILD_FILE=$(find . -maxdepth 3 -name "build.gradle" | head -n 1)
          MOD_DIR=$(dirname "$BUILD_FILE")
          echo "MOD_DIR=$MOD_DIR" >> $GITHUB_ENV
          cd "$MOD_DIR"
          if [ -f settings.gradle ] && ! grep -q "minecraftforge" settings.gradle; then
            printf "pluginManagement {\n repositories {\n  gradlePluginPortal()\n  maven { url = 'https://minecraftforge.net' }\n }\n}\n$(cat settings.gradle)" > settings.gradle
          fi
          find src -name "*.java" -exec sed -i 's/setSwingHint/setSwingHand/g' {} + 2>/dev/null || true

      - name: Compilar Mod (.jar)
        working-directory: ${{ env.MOD_DIR }}
        run: gradle build

      - name: Disponibilizar Mod compilado para Download
        uses: actions/upload-artifact@v4
        with:
          name: Mod-Compilado
          path: |
            ${{ env.MOD_DIR }}/build/libs/*.jar
            !${{ env.MOD_DIR }}/build/libs/*-sources.jar
            
